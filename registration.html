<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>

<body>

<center>

<h1>Online Book Store Registration</h1>

<form>

    Name:
    <input type="text" name="name">
    <br><br>

    Password:
    <input type="password" name="password">
    <br><br>

    E-mail ID:
    <input type="text" name="email">
    <br><br>

    Phone Number:
    <input type="text" name="phone">
    <br><br>

    Sex:
    <input type="radio" name="sex"> Male
    <input type="radio" name="sex"> Female
    <br><br>

    Date of Birth:

    <select name="day">
        <option>Day</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5</option>
        <option>6</option>
        <option>7</option>
        <option>8</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
        <option>13</option>
        <option>14</option>
        <option>15</option>
        <option>16</option>
        <option>17</option>
        <option>18</option>
        <option>19</option>
        <option>20</option>
        <option>21</option>
        <option>22</option>
        <option>23</option>
        <option>24</option>
        <option>25</option>
        <option>26</option>
        <option>27</option>
        <option>28</option>
        <option>29</option>
        <option>30</option>
        <option>31</option>
    </select>

    <select name="month">
        <option>Month</option>
        <option>January</option>
        <option>February</option>
        <option>March</option>
        <option>April</option>
        <option>May</option>
        <option>June</option>
        <option>July</option>
        <option>August</option>
        <option>September</option>
        <option>October</option>
        <option>November</option>
        <option>December</option>
    </select>

    <select name="year">
        <option>Year</option>
        <option>2000</option>
        <option>2001</option>
        <option>2002</option>
        <option>2003</option>
        <option>2004</option>
        <option>2005</option>
        <option>2006</option>
        <option>2007</option>
        <option>2008</option>
    </select>

    <br><br>

    Languages Known:

    <input type="checkbox"> English
    <input type="checkbox"> Telugu
    <input type="checkbox"> Hindi
    <input type="checkbox"> Tamil

    <br><br>

    Address:
    <br>

    <textarea rows="5" cols="40"></textarea>

    <br><br>

    <input type="submit" value="Register">
    <input type="reset" value="Reset">

</form>

</center>

</body>
</html>
